# CNB 云原生构建：push / PR 时跑 Python 测试与前端构建检查。
# 原生安装包不在这里构建：官方托管节点只有 Linux，macOS / Windows 包在本机构建后
# 上传 CNB Release（scripts/publish-client.sh）。GitHub Actions 配置保留为备选。
main:
  push:
    - name: test
      docker:
        image: python:3.12
      stages:
        - name: unit-tests
          script:
            - apt-get update -qq && apt-get install -y -qq --no-install-recommends rsync
            - python3 -m compileall -q amem tests
            - python3 -m unittest discover -s tests -t .
    - name: client-check
      docker:
        image: node:22
      stages:
        - name: frontend
          script:
            - cd client
            - npm ci
            - npm run build
  pull_request:
    - name: test
      docker:
        image: python:3.12
      stages:
        - name: unit-tests
          script:
            - apt-get update -qq && apt-get install -y -qq --no-install-recommends rsync
            - python3 -m compileall -q amem tests
            - python3 -m unittest discover -s tests -t .
    - name: client-check
      docker:
        image: node:22
      stages:
        - name: frontend
          script:
            - cd client
            - npm ci
            - npm run build
