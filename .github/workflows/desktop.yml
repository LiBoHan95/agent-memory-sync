name: desktop

# 桌面客户端只构建 macOS / Windows 原生包。
# 推 client-v* 标签会构建并创建 GitHub Release；手动触发只产 Artifacts，PR 只做前端检查。
on:
  workflow_dispatch:
  push:
    tags:
      - "client-v*"
    paths:
      - "client/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: build frontend
        working-directory: client
        run: |
          npm ci
          npm run build

  build:
    name: build ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/client-v')
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
            artifact: amem-client-macos-universal
            path: client/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: amem-client-windows-x64
            path: client/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: install frontend deps
        working-directory: client
        run: npm ci

      # 未签名构建：macOS 产物需要右键打开或去 quarantine，Windows 会弹 SmartScreen。
      # 签名需要额外配置 APPLE_CERTIFICATE / TAURI_SIGNING_PRIVATE_KEY 等 secrets。
      - name: build bundle
        working-directory: client
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/client-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list artifacts
        run: ls -lh dist

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
